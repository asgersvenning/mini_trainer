[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-trainer"
version = "0.0.1"
dependencies = [
  "torch",
  "torchvision",
  "matplotlib",
  "tqdm",
  "diskcache",
  "psutil",
  "setuptools<=81.0.0", # Temporary fix to the error "ModuleNotFoundError: No module named 'pkg_resources'" from tensorboard
  "tensorboard",
  "scipy",
  "pyarrow",
  "pyyaml>=6.0.3",
]
requires-python = ">=3.11"
authors = [
  {name = "Asger Svenning", email = "asgersvenning@gmail.com"}
]
maintainers = [
  {name = "Asger Svenning", email = "asgersvenning@gmail.com"}
]
description = "An as minimal as possible fully extendable DL image classification training and inference package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["classification", "computer vision", "deep learning", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python"
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "ipywidgets",
    "pyremotedata"
]

[project.urls]
Repository = "https://github.com/asgersvenning/mini_trainer"
"Bug Tracker" = "https://github.com/asgersvenning/mini_trainer/issues"

[project.scripts]
mt_train = "mini_trainer.train:run"
mt_predict = "mini_trainer.predict:run"
mt_htrain = "mini_trainer.hierarchical.train:run"
mt_hpredict = "mini_trainer.hierarchical.predict:run"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Enable core checks, imports, pyupgrade, and pydocstyle
select = ["E", "F", "I", "UP", "D"]
# Prefer multi-line docstring summaries (D213); ignore D200 (summary must be on first line)
ignore = ["D100", "D102", "D105", "D200", "E203", "D205", "E231", "E252", "E261", "UP015", "D415"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
# Place opening quotes on their own line and summary on the next line
make-summary-multi-line = true
pre-summary-newline = true
# Leave lines unwrapped; let editors/linters handle wrapping
wrap-summaries = 0
wrap-descriptions = 0

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "zarr>=3.1.5",
]
