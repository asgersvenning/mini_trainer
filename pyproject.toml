[project]
name = "mini_trainer"
version = "0.1.1"
default-optional-dependency-keys = ["recommended"]
dependencies = [
  "torch>=2.11",
  "torchvision",
  "matplotlib",
  "tqdm",
  "pyyaml>=6.0.3",
  "numpy>=2.4.0",
  "diskcache",
  "psutil",
]
requires-python = ">=3.12"
authors = [
  {name = "Asger Svenning", email = "asgersvenning@gmail.com"}
]
maintainers = [
  {name = "Asger Svenning", email = "asgersvenning@gmail.com"}
]
description = "An as minimal as possible fully extendable DL image classification training and inference package"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["classification", "computer vision", "deep learning", "pytorch"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]


[project.urls]
Repository = "https://github.com/asgersvenning/mini_trainer"
"Bug Tracker" = "https://github.com/asgersvenning/mini_trainer/issues"

[project.scripts]
mt_train = "mini_trainer.train:run"
mt_predict = "mini_trainer.predict:run"
mt_htrain = "mini_trainer.hierarchical.train:run"
mt_hpredict = "mini_trainer.hierarchical.predict:run"
mt_plot_dendrogram = "mini_trainer.visualization.dendrogram:run"
mt_create_combinations = "mini_trainer.utils.create_combinations:run"

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.docformatter]
# Place opening quotes on their own line and summary on the next line
make-summary-multi-line = true
pre-summary-newline = true
# Leave lines unwrapped; let editors/linters handle wrapping
wrap-summaries = 0
wrap-descriptions = 0

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "import-linter>=2.0",
]

[project.optional-dependencies]
recommended = [
  "tensorboard",
  "setuptools<=81.0.0", # Temporary fix to the error "ModuleNotFoundError: No module named 'pkg_resources'" from tensorboard
  "scipy",
  "pyarrow",
  "pycirclize>=1.10.1",
  "biopython>=1.80",
  "wandb",
]
all = [
  "mini_trainer[recommended]",
  "mini_trainer[notebook]",
  "mini_trainer[timm]",
  "mini_trainer[bioclip]",
  "mini_trainer[transformers]",
]
minimal = []
notebook = [
  "ipykernel",
  "ipywidgets",
  "pyremotedata"
]
bioclip = [
  "open_clip_torch"
]
transformers = [
  "transformers"
]
timm = [
  "timm"
]
cpu = ["torch>=2.11", "torchvision"]
cu126 = ["torch>=2.11", "torchvision"]
cu130 = ["torch>=2.11", "torchvision"]
cu132 = ["torch>=2.11", "torchvision"]

[tool.uv]
conflicts = [
    [ { extra = "cpu" }, { extra = "cu126" }, { extra = "cu130" }, { extra = "cu132" }]
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu132", extra = "cu132" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-cu132", extra = "cu132" },
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
source-include = ["mini_trainer/modeling/architectures/blacklist.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "mini_trainer"
include_external_packages = false
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "mini_trainer.visualization",
    "mini_trainer.training",
    "mini_trainer.modeling",
    "mini_trainer.utils"
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
name = "Acyclic Siblings"
type = "acyclic_siblings"
ancestors = ["mini_trainer"]
unmatched_ignore_imports_alerting = "error"