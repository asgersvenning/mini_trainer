name: Dataset benchmarks

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  schedule:
    - cron: "0 5 * * 4"
  workflow_dispatch:
    inputs:
      gpu:
        description: Run GPU profiles on a configured self-hosted GPU runner
        type: boolean
        default: false
      qt:
        description: Also run paired float and INT8 training profiles (requires gpu)
        type: boolean
        default: false
      real_data:
        description: Also run MNIST and Blair using configured runner data paths
        type: boolean
        default: false
      cuda_backend:
        description: Explicit PyTorch backend for the disposable GPU environment
        type: choice
        options: [cu130, cu126, cu132]
        default: cu130

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate manual profile selection
        if: github.event_name == 'workflow_dispatch' && (inputs.real_data || inputs.qt) && !inputs.gpu
        run: |
          echo 'The real_data and qt profiles require gpu=true.' >&2
          exit 2
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --python 3.13
      - name: Synthetic oracle baseline
        run: bash dev/check-benchmarks.sh cpu benchmark-results
      - name: Visible run summary
        if: always()
        run: python3 -m dev.benchmarks.summarize benchmark-results >> "$GITHUB_STEP_SUMMARY"
      - name: Retain reports and reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            benchmark-results/
            !benchmark-results/**/data/**/*.png

  gpu:
    if: (github.event_name == 'workflow_dispatch' && inputs.gpu) || (github.event_name == 'schedule' && vars.ENABLE_GPU_BENCHMARKS == 'true')
    runs-on: [self-hosted, linux, gpu]
    timeout-minutes: 45
    env:
      BENCHMARK_DATA_ROOT: ${{ vars.BENCHMARK_DATA_ROOT }}
      BLAIR_CLASS_SPEC: ${{ vars.BLAIR_CLASS_SPEC }}
      QT_ENABLED: ${{ inputs.qt || vars.BENCHMARK_QT == 'true' }}
      CUDA_BACKEND: ${{ inputs.cuda_backend || vars.BENCHMARK_CUDA_BACKEND || 'cu130' }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install a disposable GPU environment
        run: |
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/benchmark-env-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'UV_PROJECT_ENVIRONMENT=%s\nBENCHMARK_PYTHON=%s/bin/python\n' "$UV_PROJECT_ENVIRONMENT" "$UV_PROJECT_ENVIRONMENT" >> "$GITHUB_ENV"
          qt_extras=()
          if [[ "$QT_ENABLED" == "true" ]]; then qt_extras=(--extra quantization); fi
          uv sync --locked --extra "$CUDA_BACKEND" "${qt_extras[@]}" --python 3.13
      - name: CUDA optimizer and AMP step regressions
        env:
          RUN_CUDA_TESTS: "1"
        run: '"$BENCHMARK_PYTHON" -m pytest tests/training/test_optimizer_steps.py -k cuda'
      - name: CUDA INT8 model and checkpoint regressions
        if: inputs.qt || vars.BENCHMARK_QT == 'true'
        env:
          RUN_CUDA_TESTS: "1"
        run: '"$BENCHMARK_PYTHON" -m pytest tests/quantization/test_quantized_training.py tests/quantization/test_quantized_training_model.py'
      - name: Paired synthetic quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt benchmark-qt
      - name: Paired real-data quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt-real benchmark-qt-real
      - name: Paired dense MNIST quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt-dense benchmark-qt-dense
      - name: Multi-seed large-batch quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt-large-batch benchmark-qt-large-batch
      - name: Multi-seed CUDA graph quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt-cudagraphs benchmark-qt-cudagraphs
      - name: Multi-seed model and optimizer graph quantized training
        if: (inputs.qt || vars.BENCHMARK_QT == 'true') && (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh qt-optimizer-cudagraphs benchmark-qt-optimizer-cudagraphs
      - name: Synthetic GPU precision profiles
        run: bash dev/check-benchmarks.sh gpu benchmark-gpu
      - name: Real-data progression
        if: (inputs.real_data || vars.BENCHMARK_REAL_DATA == 'true') && !cancelled()
        run: bash dev/check-benchmarks.sh real benchmark-real
      - name: Visible run summaries
        if: always()
        run: |
          python3 -m dev.benchmarks.summarize benchmark-gpu >> "$GITHUB_STEP_SUMMARY"
          for qt_results in benchmark-qt benchmark-qt-real benchmark-qt-dense benchmark-qt-large-batch benchmark-qt-cudagraphs benchmark-qt-optimizer-cudagraphs; do
            if [[ -d "$qt_results" ]]; then
              python3 -m dev.benchmarks.summarize "$qt_results" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [[ -d benchmark-real ]]; then
            python3 -m dev.benchmarks.summarize benchmark-real >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain reports, failures and reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks-gpu-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            benchmark-gpu/
            benchmark-real/
            benchmark-qt/
            benchmark-qt-real/
            benchmark-qt-dense/
            benchmark-qt-large-batch/
            benchmark-qt-cudagraphs/
            benchmark-qt-optimizer-cudagraphs/
            !benchmark-qt/**/data/**/*.png
            !benchmark-gpu/**/data/**/*.png
      - name: Remove the disposable GPU environment
        if: always()
        run: |
          if [[ -n "${UV_PROJECT_ENVIRONMENT:-}" && "$UV_PROJECT_ENVIRONMENT" == "$RUNNER_TEMP"/benchmark-env-* ]]; then
            rm -rf -- "$UV_PROJECT_ENVIRONMENT"
          fi
