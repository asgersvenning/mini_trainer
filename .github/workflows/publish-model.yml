name: Prepare and publish MAMBO V3

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mambo-v3
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'MAMBO_v3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow
      - name: Build pinned candidate
        run: |
          .venv-release/bin/python -m dev.releases.mambo_v3.prepare_candidate \
            --source "$RUNNER_TEMP/mambo-inputs" --output "$RUNNER_TEMP/candidate" --download
      - name: Qualify exact installed artifacts
        run: .venv-release/bin/python -m dev.releases.mambo_v3.qualify_candidate "$RUNNER_TEMP/candidate"
      - name: Stage public files
        run: |
          .venv-release/bin/python -m dev.releases.mambo_v3.publication_assets \
            "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/publication"
      - uses: actions/upload-artifact@v4
        with:
          name: mambo-v3-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: mambo-v3-publication
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 30

  package:
    needs: prepare
    if: github.event_name == 'release' && github.event.release.tag_name == 'MAMBO_v3' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi-model
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mambo-v3-candidate
          path: candidate/
      - run: cd candidate && sha256sum --check SHA256SUMS
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Require the intended training dependency to be public first
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          from pathlib import Path
          package = json.loads(Path('candidate/release-candidate.json').read_text())['training_distribution']
          with urllib.request.urlopen(f"https://pypi.org/pypi/{package['name']}/{package['version']}/json") as response:
              metadata = json.load(response)['info']
          assert metadata['project_urls']['Repository'] == 'https://github.com/asgersvenning/mini_trainer'
          PYTHON
      - name: Publish deployment package only
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ candidate/dist/mambo_v3-*.whl candidate/dist/mambo_v3-*.tar.gz

  assets:
    needs: package
    runs-on: ubuntu-latest
    environment: model-assets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mambo-v3-publication
          path: publication/
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow 'huggingface-hub>=0.36,<2'
      - name: Publish GitHub assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: .venv-release/bin/python -m dev.releases.mambo_v3.publish_assets github publication/github "$GH_REPOSITORY"
      - name: Publish model and immutable Hugging Face revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
        run: .venv-release/bin/python -m dev.releases.mambo_v3.publish_assets model publication/model "$HF_MODEL_REPO"

  demo:
    needs: assets
    runs-on: ubuntu-latest
    environment: model-demo
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: mambo-v3-publication
          path: publication/
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow 'huggingface-hub>=0.36,<2'
      - name: Deploy the reviewed Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: .venv-release/bin/python -m dev.releases.mambo_v3.publish_assets space publication/space "$HF_SPACE_REPO"
