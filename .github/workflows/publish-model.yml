name: Prepare and publish model

on:
  push:
    branches: ["release/models/**"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      product:
        description: Model distribution name, e.g. mambo-v3
        type: string
        required: true
      resume_run:
        description: Original publication run ID to finish assets/demo without rebuilding (leave blank to prepare)
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      product: ${{ steps.route.outputs.product }}
      module: ${{ steps.route.outputs.module }}
      tag: ${{ steps.route.outputs.tag }}
      version: ${{ steps.route.outputs.version }}
      recovery_source: ${{ steps.recovery.outputs.source }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: route
        env:
          RELEASE_PRODUCT: ${{ inputs.product }}
        run: python3 dev/release_route.py models
      - id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.resume_run }}
          RELEASE_TAG: ${{ steps.route.outputs.tag }}
          RELEASE_MODULE: ${{ steps.route.outputs.module }}
        run: python3 -m ${RELEASE_MODULE}.recover_publication run --run "$ORIGINAL_RUN" --tag "$RELEASE_TAG"

  prepare:
    env:
      RELEASE_MODULE: ${{ needs.route.outputs.module }}
    needs: route
    if: needs.route.outputs.enabled == 'true' && inputs.resume_run == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow
      - name: Build pinned candidate
        run: |
          .venv-release/bin/python -m ${RELEASE_MODULE}.prepare_candidate \
            --source "$RUNNER_TEMP/model-inputs" --output "$RUNNER_TEMP/candidate" --download
      - name: Qualify exact installed artifacts
        run: .venv-release/bin/python -m ${RELEASE_MODULE}.qualify_candidate "$RUNNER_TEMP/candidate"
      - name: Stage public files
        run: |
          .venv-release/bin/python -m ${RELEASE_MODULE}.publication_assets \
            "$RUNNER_TEMP/candidate" --output "$RUNNER_TEMP/publication"
      - uses: actions/upload-artifact@v4
        with:
          name: model-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: model-publication
          path: ${{ runner.temp }}/publication/
          if-no-files-found: error
          retention-days: 30

  package:
    env:
      RELEASE_MODULE: ${{ needs.route.outputs.module }}
      RELEASE_PRODUCT: ${{ needs.route.outputs.product }}
    needs: [route, prepare]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi-model-${{ needs.route.outputs.product }}
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model-candidate
          path: candidate/
      - run: cd candidate && sha256sum --check SHA256SUMS
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Require the intended training dependency to be public first
        run: |
          python3 - <<'PYTHON'
          import json, urllib.request
          from pathlib import Path
          package = json.loads(Path('candidate/release-candidate.json').read_text())['training_distribution']
          with urllib.request.urlopen(f"https://pypi.org/pypi/{package['name']}/{package['version']}/json") as response:
              metadata = json.load(response)['info']
          assert metadata['project_urls']['Repository'] == 'https://github.com/asgersvenning/mini_trainer'
          PYTHON
      - name: Publish deployment package only
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ candidate/dist/"${RELEASE_PRODUCT//-/_}"-*.whl candidate/dist/"${RELEASE_PRODUCT//-/_}"-*.tar.gz

  assets:
    env:
      RELEASE_MODULE: ${{ needs.route.outputs.module }}
      RELEASE_TAG: ${{ needs.route.outputs.tag }}
    needs: [route, package]
    if: ${{ !cancelled() && needs.route.result == 'success' && (needs.package.result == 'success' || needs.route.outputs.recovery_source != '') }}
    runs-on: ubuntu-latest
    environment: model-assets-${{ needs.route.outputs.product }}
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-publication
          path: publication/
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow 'huggingface-hub>=1.19,<2'
      - name: Verify retained release identity
        env:
          RELEASE_SOURCE: ${{ needs.route.outputs.recovery_source || github.sha }}
          RELEASE_PRODUCT: ${{ needs.route.outputs.product }}
          RELEASE_VERSION: ${{ needs.route.outputs.version }}
        run: |
          .venv-release/bin/python -m ${RELEASE_MODULE}.recover_publication payload publication \
            --source "$RELEASE_SOURCE" --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION"
      - name: Publish GitHub assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: .venv-release/bin/python -m ${RELEASE_MODULE}.publish_assets github publication/github "$GH_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Publish model and record immutable Hugging Face commit
        env:
          HF_MODEL_REPO: ${{ vars.HF_MODEL_REPO }}
          HF_OIDC_RESOURCE: ${{ vars.HF_MODEL_REPO }}
        shell: bash
        run: |
          : "${HF_MODEL_REPO:?Set the repository variable in this GitHub environment}"
          HF_TOKEN="$(.venv-release/bin/hf auth token)"
          test -n "$HF_TOKEN"
          echo "::add-mask::$HF_TOKEN"
          export HF_TOKEN
          .venv-release/bin/python -m ${RELEASE_MODULE}.publish_assets model publication/model "$HF_MODEL_REPO" --receipt "$RUNNER_TEMP/hf-model-revision.json"
      - name: Attach immutable model revision to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: .venv-release/bin/python -m ${RELEASE_MODULE}.publish_assets github-receipt "$RUNNER_TEMP/hf-model-revision.json" "$GH_REPOSITORY" --tag "$RELEASE_TAG"

  demo:
    env:
      RELEASE_MODULE: ${{ needs.route.outputs.module }}
    needs: [route, assets]
    if: ${{ !cancelled() && needs.route.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-space-${{ needs.route.outputs.product }}
      cancel-in-progress: false
    environment: model-demo-${{ needs.route.outputs.product }}
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: model-publication
          path: publication/
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: astral-sh/setup-uv@v8.1.0
      - run: uv venv --python 3.13 .venv-release
      - run: uv pip install --python .venv-release/bin/python numpy pillow 'huggingface-hub>=1.19,<2'
      - name: Verify retained release identity
        env:
          RELEASE_SOURCE: ${{ needs.route.outputs.recovery_source || github.sha }}
          RELEASE_PRODUCT: ${{ needs.route.outputs.product }}
          RELEASE_VERSION: ${{ needs.route.outputs.version }}
        run: |
          .venv-release/bin/python -m ${RELEASE_MODULE}.recover_publication payload publication \
            --source "$RELEASE_SOURCE" --product "$RELEASE_PRODUCT" --version "$RELEASE_VERSION"
      - name: Deploy the reviewed Space
        env:
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
          HF_OIDC_RESOURCE: spaces/${{ vars.HF_SPACE_REPO }}
        shell: bash
        run: |
          : "${HF_SPACE_REPO:?Set the repository variable in this GitHub environment}"
          HF_TOKEN="$(.venv-release/bin/hf auth token)"
          test -n "$HF_TOKEN"
          echo "::add-mask::$HF_TOKEN"
          export HF_TOKEN
          .venv-release/bin/python -m ${RELEASE_MODULE}.publish_assets space publication/space "$HF_SPACE_REPO" --receipt "$RUNNER_TEMP/hf-space-revision.json"
      - uses: actions/upload-artifact@v4
        with:
          name: hf-space-revision
          path: ${{ runner.temp }}/hf-space-revision.json
          if-no-files-found: error
