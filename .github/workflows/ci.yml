name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.5.21/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync --all-extras

      - name: Lint and format with ruff
        run: |
          uv run ruff check mini_trainer tests
          uv run ruff format --check mini_trainer

      - name: Test with pytest
        run: |
          uv run pytest --cov=mini_trainer --cov-report=xml --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: asgersvenning/mini_trainer
