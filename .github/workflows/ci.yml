name: CI

on:
  push:
    branches: ["master", "quant"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra all --extra cpu --python ${{ matrix.python-version }}

      - name: Static checks
        run: bash dev/check.sh static

      - name: Test with pytest
        run: bash dev/check.sh test --cov=mini_trainer --cov-report=xml --cov-report=term

      - name: Standalone ONNX Runtime parity
        run: bash dev/check-onnx.sh

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: asgersvenning/mini_trainer

  wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Minimal installed-wheel checks
        run: bash dev/check-wheel.sh ${{ matrix.python-version }}

  quantization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra cpu --extra quantization --python 3.13
      - name: QAT continuation and native INT8 inference
        env:
          OMP_NUM_THREADS: "1"
        run: bash dev/check.sh test tests/quantization/test_quantization.py
