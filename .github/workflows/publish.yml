name: Publish training package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'minitrainer-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Validate release identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          assert project['name'] == 'minitrainer'
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f"minitrainer-v{project['version']}", 'Tag and package version differ'
          PY
      - run: uv python install 3.13
      - name: Qualify and retain the wheel
        run: WHEEL_OUTPUT_DIR="$PWD/dist" bash dev/check-wheel.sh 3.13
      - run: uv build --sdist --out-dir dist
      - name: Record artifacts
        run: sha256sum dist/* > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: minitrainer-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'minitrainer-v') && !github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: pypi-training
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minitrainer-distributions
          path: dist/
      - name: Verify qualified artifact bytes
        run: sha256sum --check dist/SHA256SUMS
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Publish qualified distributions
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*.whl dist/*.tar.gz
