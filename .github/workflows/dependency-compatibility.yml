name: Latest dependency compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: Resolve latest compatible dependencies in this checkout
        run: uv lock --upgrade
      - run: uv sync --locked --extra all --extra cpu --python ${{ matrix.python-version }}
      - run: bash dev/check.sh all
      - run: bash dev/check-onnx.sh
      - run: bash dev/check-wheel.sh ${{ matrix.python-version }}
