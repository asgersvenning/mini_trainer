# Stage 2 (CPU): mini_metrics bootstrap of the stage-1 evidence snapshot on all cores, uploaded to
# ERDA as a separate replicates folder. Submit after job.toml has finished, with the same arguments.
# Substitute REVIEWED_COMMIT (full hash); prefix the command with MT_UPLOAD=0 for a dry run.
name = "mini-trainer-test-bootstrap"
replicas = 1
ssh_enabled = false

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "cpu-amd-zen5-128-vcpu"
category = "cpu-amd-zen5"
provider = "ucloud"

[time_allocation]
hours = 6

[[resources]]
type = "file"
path = "/12383016/global_lepi"
read_only = true

[[resources]]
type = "file"
path = "/12348329/mini-trainer-ablations/datasets/plantnet"
read_only = true

[[resources]]
type = "file"
path = "/12348329/mini-trainer-ablations/results"
read_only = false

[[resources]]
type = "file"
path = "/12348329/mini-trainer-secrets"
read_only = true

[sync]
local = "publication/experiments/training_ablations/ucloud/test-predictions"
remote = "/12348329/mini-trainer-ablations/test-predictions/test-predictions-bootstrap"

[setup]
run = "MT_STAGE=bootstrap bash /work/test-predictions-bootstrap/run.sh REVIEWED_COMMIT factorial-11=/work/results/factorial-11/study overnight-12=/work/results/overnight-12/study duration-12=/work/results/overnight-12/duration hierarchy-14=/work/results/hierarchy-14/study support-16=/work/results/support-16/study plantnet-16=/work/results/plantnet-16/study"
