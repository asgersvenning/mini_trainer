# Keep beside ucloud/; fill account-specific identifiers and the Git commit below.
name = "mini-trainer-ablation-api-pilot"
replicas = 1
ssh_enabled = false

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "REPLACE_FROM_UCLOUD_PRODUCTS"

[time_allocation]
hours = 1

[[resources]]
type = "file"
path = "/REPLACE_DRIVE/global_lepi"
read_only = true

[[resources]]
type = "file"
path = "/REPLACE_DRIVE/results"
read_only = false

[sync]
local = "ucloud"
remote = "/REPLACE_DRIVE/REPLACE_FRESH_SNAPSHOT/ablation-bootstrap"

[setup]
# Mount global_lepi directly to match the study config's /work/global_lepi paths.
# Do not set python="uv": that scaffold performs an implicit uv sync.
run = "bash /work/ablation-bootstrap/bootstrap.sh REPLACE_FULL_GIT_COMMIT /work/results/ablation-api-pilot --wait-for-wandb"
# No schedule/auto-extension: this pilot has a hard one-hour allocation.
