# Copy beside setup.sh in an immutable snapshot; fill account-specific identifiers.
# The remote snapshot folder must be fresh and named mini_trainer for these paths.
name = "mini-trainer-ablation-api-pilot"
replicas = 1
ssh_enabled = false

[application]
name = "pytorch-te"
version = "26.05"

[product]
id = "gpu-nvidia-b200-1-gpu"
category = "gpu-nvidia-b200"
provider = "REPLACE_FROM_UCLOUD_PRODUCTS"

[time_allocation]
hours = 1

[[resources]]
type = "file"
path = "/REPLACE_DRIVE/datasets"
read_only = true

[[resources]]
type = "file"
path = "/REPLACE_DRIVE/results"
read_only = false

[sync]
local = "../../.."
remote = "/REPLACE_DRIVE/REPLACE_FRESH_SNAPSHOT/mini_trainer"

[setup]
# Set the study config's data paths beneath /work/datasets before submission.
# Do not set python="uv": that scaffold performs an implicit uv sync.
script = "setup.sh"
run = "python -m publication.experiments.training_ablations.study prepare /work/results/ablation-api-pilot --config publication/experiments/training_ablations/config.json && python -m publication.experiments.training_ablations.study qualify /work/results/ablation-api-pilot --hours 0.5"
# No schedule/auto-extension: this pilot has a hard one-hour allocation.
