name: <NAME>

# Optional custom base output directory (e.g., on Gefion persistent shared storage /dcai/projects/...)
# Environment variables like $PROJECT, $USER, or $HOME are automatically expanded.
# Defaults to "slurm_jobs" if omitted (<NAME>/results is appended automatically).
# output_dir: /dcai/projects/$PROJECT/mini_trainer/experiments

stubs:
    train: ...
    eval: ...
    metric: ...
    

slurm:
    account: <ACCOUNT>
    partition: <PARTITION>
    gres: gpu:nvidia_h100_80gb_hbm3:1
    cpus-per-task: 32
    mem: 64G
    time: <TIME>

datasets:
    name:
        path: ...
        data_index: [False/...]
    # ...

experiment:
    model:
        - ...
    head:
        - ...
    dataset:
        - ... # name

eval:
    name:
        - ...
    # ...

args:
    shared:
        dtype: float16
        batch_size: 
            dataset:
                A: 256
                B: 128
                C: 64
    train:
        warmup_epochs: 0.1
        class_weighted: true
        wandb: true
    metrics:
        all: true
        verbose: 1
        optimal: true
