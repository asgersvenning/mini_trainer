schema_version = 1
exclusive_minimum_rows = 0
# Geographic predicates are OR-ed; state_province/excluded_countries then constrain that union.
# Counts include all metadata splits, without additional deduplication.

[presets.europe]
exclusive_minimum_rows = 25
label = "Europe (legacy)"
continents = ["EUROPE"]
scope = "Records assigned EUROPE by the metadata, including European-labelled portions of transcontinental countries."

[presets.north_europe]
exclusive_minimum_rows = 25
label = "Northern Europe (legacy)"
countries = ["DE", "DK", "EE", "FI", "LT", "LV", "NL", "NO", "PL", "SE"]
scope = "Germany, Denmark, Estonia, Finland, Lithuania, Latvia, Netherlands, Norway, Poland, Sweden (Ireland, Iceland, Åland, Faroe Islands, Guernsey, Isle of Man, Jersey, Svalbard/Jan Mayen: ambiguous historical inclusion; adding any or all leaves the species list unchanged)."

[presets.australia]
label = "Australia including Tasmania"
countries = ["AU"]
scope = "All Australian records, including Tasmania and other territories recorded under AU; not all Oceania."

[presets.tasmania]
label = "Tasmania only"
countries = ["AU"]
state_province = ["Tasmania"]
scope = "Australian records explicitly assigned stateProvince Tasmania. Species recorded there, not only endemic species; blank/other state values are excluded."

[presets.north_america]
label = "North America"
countries = ["CA", "US", "MX", "GL", "BM", "PM"]
scope = "Canada, United States, Mexico, Greenland, Bermuda, Saint Pierre and Miquelon. Whole countries, including US records outside the continental mainland."

[presets.central_america]
label = "Central America"
countries = ["MX", "BZ", "GT", "HN", "SV", "NI", "CR", "PA"]
scope = "Mexico, Belize, Guatemala, Honduras, El Salvador, Nicaragua, Costa Rica, Panama. Mexico deliberately overlaps North America."

[presets.south_america]
label = "South America"
continents = ["SOUTH_AMERICA"]
countries = ["AR", "BO", "BR", "CL", "CO", "EC", "FK", "GF", "GY", "PY", "PE", "SR", "UY", "VE", "CR", "PA"]
scope = "All SOUTH_AMERICA records or records from Argentina, Bolivia, Brazil, Chile, Colombia, Ecuador, Falklands, French Guiana, Guyana, Paraguay, Peru, Suriname, Uruguay, Venezuela, Costa Rica or Panama. Costa Rica and Panama deliberately overlap Central America."

[presets.caribbean]
label = "Caribbean"
countries = ["AG", "AI", "AW", "BB", "BL", "BQ", "BS", "CU", "CW", "DM", "DO", "GD", "GP", "HT", "JM", "KN", "KY", "LC", "MF", "MQ", "MS", "PR", "SX", "TC", "TT", "VC", "VG", "VI", "BM", "BZ", "GY", "SR", "GF"]
scope = "Caribbean islands and territories, Bahamas, Bermuda, Belize and the Guianas (Guyana, Suriname, French Guiana). Does not include every mainland country with a Caribbean coast."

[presets.south_asia]
label = "South Asia"
countries = ["AF", "BD", "BT", "IN", "MV", "NP", "PK", "LK", "MM", "IR"]
scope = "Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, Sri Lanka, Myanmar and Iran; deliberately broad western/eastern overlap."

[presets.asia]
label = "Asia"
continents = ["ASIA"]
countries = ["AF", "AM", "AZ", "BH", "BD", "BT", "BN", "KH", "CN", "CY", "GE", "HK", "IN", "ID", "IR", "IQ", "IL", "JP", "JO", "KZ", "KP", "KR", "KW", "KG", "LA", "LB", "MO", "MY", "MV", "MN", "MM", "NP", "OM", "PK", "PS", "PH", "QA", "RU", "SA", "SG", "LK", "SY", "TW", "TJ", "TH", "TL", "TR", "TM", "AE", "UZ", "VN", "YE"]
scope = "All ASIA records plus all records from the listed Asian countries and territories, including Russia, Turkey, Georgia, Armenia, Azerbaijan and Cyprus in full. Includes their European-labelled records and records with blank continent."

[presets.japan]
label = "Japan"
countries = ["JP"]
scope = "All records assigned countryCode JP, including islands."

[presets.africa]
label = "Africa"
continents = ["AFRICA"]
countries = ["DZ", "AO", "BJ", "BW", "BF", "BI", "CV", "CM", "CF", "TD", "KM", "CG", "CD", "CI", "DJ", "EG", "GQ", "ER", "SZ", "ET", "GA", "GM", "GH", "GN", "GW", "KE", "LS", "LR", "LY", "MG", "MW", "ML", "MR", "MU", "YT", "MA", "MZ", "NA", "NE", "NG", "RE", "RW", "SH", "ST", "SN", "SC", "SL", "SO", "ZA", "SS", "SD", "TZ", "TG", "TN", "UG", "EH", "ZM", "ZW"]
scope = "All AFRICA records plus the listed African countries and island territories. AFRICA-labelled records from transcontinental/overseas countries remain included."

[presets.subsaharan_africa]
label = "Sub-Saharan Africa (broad)"
continents = ["AFRICA"]
countries = ["AO", "BJ", "BW", "BF", "BI", "CV", "CM", "CF", "TD", "KM", "CG", "CD", "CI", "DJ", "GQ", "ER", "SZ", "ET", "GA", "GM", "GH", "GN", "GW", "KE", "LS", "LR", "MG", "MW", "ML", "MR", "MU", "YT", "MZ", "NA", "NE", "NG", "RE", "RW", "SH", "ST", "SN", "SC", "SL", "SO", "ZA", "SS", "SD", "TZ", "TG", "UG", "ZM", "ZW"]
excluded_countries = ["DZ", "EG", "LY", "MA", "TN", "EH"]
scope = "Broad African selection excluding Algeria, Egypt, Libya, Morocco, Tunisia and Western Sahara. Includes Sudan, Mauritania, Mali, Niger, Chad, the Horn, Madagascar and island territories; this is not a Sahara boundary polygon."

[presets.mediterranean]
label = "Mediterranean (broad)"
countries = ["AL", "DZ", "BA", "HR", "CY", "EG", "FR", "GR", "IL", "IT", "LB", "LY", "MT", "MC", "ME", "MA", "PS", "SI", "ES", "SY", "TN", "TR", "PT", "GI", "AD", "SM", "VA", "MK", "BG", "RS", "JO"]
scope = "Whole Mediterranean coastal countries/territories plus Portugal, Andorra, San Marino, Vatican City, North Macedonia, Bulgaria, Serbia and Jordan. Includes inland and overseas records of selected countries, not only Mediterranean climate zones."

[presets.arctic]
label = "Arctic / broad northern-country scope"
countries = ["CA", "US", "GL", "IS", "FO", "NO", "SJ", "SE", "FI", "AX", "RU"]
scope = "Canada, United States, Greenland, Iceland, Faroe Islands, Norway, Svalbard/Jan Mayen, Sweden, Finland, Åland and Russia. A deliberately expansive country proxy: includes southern records and is NOT an Arctic Circle or tundra filter."

[presets.oceania]
label = "Oceania"
continents = ["OCEANIA"]
countries = ["AU", "NZ", "PG", "FJ", "SB", "VU", "NC", "PF", "WS", "AS", "TO", "TV", "KI", "NR", "FM", "MH", "PW", "GU", "MP", "CK", "NU", "TK", "WF", "PN", "NF"]
scope = "All OCEANIA records plus Australia, New Zealand, Papua New Guinea and the listed Pacific countries/territories. Australia and Tasmania intentionally overlap."

[presets.southeast_asia]
label = "Southeast Asia"
countries = ["BN", "KH", "ID", "LA", "MY", "MM", "PH", "SG", "TH", "TL", "VN", "PG"]
scope = "Brunei, Cambodia, Indonesia, Laos, Malaysia, Myanmar, Philippines, Singapore, Thailand, Timor-Leste, Vietnam and Papua New Guinea; whole-island-region overlap with Oceania is intentional."

[presets.east_asia]
label = "East Asia"
countries = ["CN", "HK", "MO", "TW", "JP", "KP", "KR", "MN", "RU"]
scope = "China, Hong Kong, Macao, Taiwan, Japan, North Korea, South Korea, Mongolia and Russia. All Russia is included because this preset uses whole-country filters."

[presets.middle_east]
label = "Middle East"
countries = ["TR", "CY", "SY", "LB", "IL", "PS", "JO", "IQ", "IR", "KW", "SA", "BH", "QA", "AE", "OM", "YE", "EG", "AM", "AZ", "GE", "AF", "PK"]
scope = "Turkey, Cyprus, Syria, Lebanon, Israel, Palestine, Jordan, Iraq, Iran, Kuwait, Saudi Arabia, Bahrain, Qatar, UAE, Oman, Yemen, Egypt, Armenia, Azerbaijan, Georgia, Afghanistan and Pakistan. Deliberate overlap with Mediterranean, Africa and South Asia."
